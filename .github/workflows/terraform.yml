name: "gitopsproject"    #name of workflow
on:
  push:                   #when code is push
    branches:     
      - main                # on main branch (branch names are user defined)
      - stage               # or stage branch (branch names are user defined)
    paths:
      - terraform/**        # folder name inside the branches
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
# credentials to login AWS via access key and secret key.variable name should be exactly with same name
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}          #secrets stored on github
  AWS_SECURE_ACCESS_KEY: ${{ secrets.AWS_SECURE_ACCESS_KEY }}  #secrets stored on github

# to access and store tf.state file on S3 bucket. variable name can be anything.
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: gitopsproject

jobs:
    terraform: 
      name: "apply terraform code changes"
      runs-on: ubuntu-latest                #container on which it will run
      defaults:
        run:
          shell: bash                       # shell to be used inside container
          working-directory: ./terraform    # with go in terraform directory inside container.
      
      steps:
        - name: checkout source code
          uses: actions/checkout@v4

        - name: Setup terraform with specified version on the runner. i.e container
          uses: hashicorp/setup-terraform@v3
          #with:
          #  terraform_version: "1.1.7"

        # to initialize terraform on runner (container)
        #- name: terraform init      # name can we anything
         # id: init                  # id we can reference.
          #run: terraform init -backend-config="bucket=$BUCKET_TF_STATE"     # this will actually run comamnd inside runner

        # to check whether terraform format is correct
        - name: terraform format
          id: fmt
          run: terraform fmt -check

        - name: terraform validate
          id: validate
          run: terraform validate

        - name: terraform plan
          id: plan
          run: terraform plan -no-color -input=false -out planfile
          continue-on-error: true

        - name: terraform plan status
          if: steps.plan.outcome == 'failure'
          run: exit 1